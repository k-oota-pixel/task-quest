name: Verify saved final-clear flags
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-final-clear-flags.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Query deployed snapshots (aggregate totals only; no user data in logs)
        run: |
          node --input-type=module - <<'NODE'
          const url='https://task-quest.onrender.com/api/adventure/rankings?mode=';
          for(const mode of ['tower','dungeon']){
            let response;
            for(let attempt=0;attempt<4;attempt++){
              try{response=await fetch(url+mode,{signal:AbortSignal.timeout(25000)});if(response.ok)break;}
              catch(error){if(attempt===3)throw error;}
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            if(!response?.ok)throw Error(mode+' server returned '+response?.status);
            const data=await response.json();
            if(!Array.isArray(data.leaders))throw Error(mode+' missing leaders');
            const finalists=data.leaders.filter(row=>Number(row.floor)===100);
            console.log(mode+': listed finalists='+finalists.length+
              ', saved full clears='+finalists.filter(row=>row.cleared===true).length+
              ', not yet cleared='+finalists.filter(row=>row.cleared!==true).length);
          }
          NODE
