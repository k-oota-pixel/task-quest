name: Patch TODAY graded text repair
on:
  push:
    branches: [fix/today-level-repair]
    paths:
      - scripts/patch-today-level-repair.mjs
      - .github/workflows/patch-today-level-repair.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-level-repair
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/patch-today-level-repair.mjs
      - run: |
          node --check today-news.mjs
          node --test today-news.test.mjs today-feeds.test.mjs api-security.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-news.mjs today-news.test.mjs
          git commit -m "Repair short TODAY graded texts before publishing"
          git push origin HEAD:fix/today-level-repair
