name: Auth read regression checks
on:
  push:
    branches: [main]
    paths:
      - 'code-auth.mjs'
      - 'code-auth.test.mjs'
      - 'auth-read-optimization.test.mjs'
      - 'request-auth.mjs'
      - 'server.mjs'
      - '.github/workflows/auth-read-check.yml'
  pull_request:
    paths:
      - 'code-auth.mjs'
      - 'code-auth.test.mjs'
      - 'auth-read-optimization.test.mjs'
      - 'request-auth.mjs'
      - 'server.mjs'
      - '.github/workflows/auth-read-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test code-auth.test.mjs auth-read-optimization.test.mjs
