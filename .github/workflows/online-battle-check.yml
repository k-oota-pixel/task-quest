name: Online battle regression checks
on:
  push:
    paths:
      - 'online-battle.mjs'
      - 'online-battle-standings.mjs'
      - 'online-battle-standings.test.mjs'
      - 'online-battle.test.mjs'
      - '.github/workflows/online-battle-check.yml'
  pull_request:
    paths:
      - 'online-battle.mjs'
      - 'online-battle.test.mjs'
      - '.github/workflows/online-battle-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test online-battle.test.mjs online-battle-standings.test.mjs
