name: Patch TODAY curated fallback
on:
  push:
    branches: [feature/today-curated-fallback]
    paths:
      - scripts/patch-today-fallback.mjs
      - .github/workflows/patch-today-fallback.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/today-curated-fallback
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/patch-today-fallback.mjs
      - name: Validate fallback
        run: |
          node --check today-news.mjs
          node --check today-feeds.mjs
          node --test today-feeds.test.mjs today-news.test.mjs api-security.test.mjs
      - name: Commit integration
        run: |
          if git diff --quiet -- today-news.mjs today-feeds.mjs; then
            echo "TODAY fallback already integrated"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-news.mjs today-feeds.mjs
          git commit -m "Use curated official sources when Search quota is unavailable"
          git push origin HEAD:feature/today-curated-fallback
