name: Install developer contact endpoint
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/install-contact-message.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.mjs')
          s=p.read_text()
          imp="import {createContactMessage} from './contact-message.mjs';"
          anchor="import {createTodayNewsGenerator} from './today-news.mjs';"
          if imp not in s:
              if anchor not in s: raise SystemExit('import anchor missing')
              s=s.replace(anchor,anchor+'\n'+imp,1)
          handler="const handleContactMessage=createContactMessage({verifyUser,readJson,send,fail});"
          anchor2="const handlePre2Interview=createPre2Interview({readJson,send,fail});"
          if handler not in s:
              if anchor2 not in s: raise SystemExit('handler anchor missing')
              s=s.replace(anchor2,anchor2+'\n'+handler,1)
          route="  if(path==='/api/contact-message')return handleContactMessage(req,res);"
          anchor3="  if(path==='/api/pet-chat')return handlePetChat(req,res);"
          if route not in s:
              if anchor3 not in s: raise SystemExit('route anchor missing')
              s=s.replace(anchor3,route+'\n'+anchor3,1)
          p.write_text(s)
          PY
          node --check server.mjs
          node --test contact-message.test.mjs
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add server.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Wire developer contact email endpoint"
          git push
