name: Patch TODAY missions
on:
  push:
    branches: [feature/today-missions]
    paths:
      - scripts/patch-today-missions.mjs
      - .github/workflows/patch-today-missions.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/today-missions
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/patch-today-missions.mjs
      - run: |
          node --check today-news.mjs
          node --test today-news.test.mjs today-feeds.test.mjs api-security.test.mjs
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add today-news.mjs today-news.test.mjs
          git commit -m "Generate purposeful missions with TODAY stories"
          git push origin HEAD:feature/today-missions
