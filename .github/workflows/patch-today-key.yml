name: Patch TODAY generator key
on:
  push:
    branches: [fix/today-generator-key]
    paths:
      - scripts/patch-today-key.mjs
      - .github/workflows/patch-today-key.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/today-generator-key
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/patch-today-key.mjs
      - run: |
          node --check server.mjs
          node --test today-news.test.mjs api-security.test.mjs
      - run: |
          if git diff --quiet -- server.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs
          git commit -m "Use backup Gemini capacity for TODAY"
          git push origin HEAD:fix/today-generator-key
