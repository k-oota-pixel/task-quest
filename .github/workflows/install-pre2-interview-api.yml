name: Install Pre-2 interview API

on:
  push:
    paths:
      - '.github/workflows/install-pre2-interview-api.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server route
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('server.mjs')
          s=p.read_text(encoding='utf-8')

          imp="import {createPre2Interview} from './pre2-interview.mjs';"
          if imp not in s:
              anchor="import {createTalkQuest} from './talk-quest.mjs';"
              if anchor not in s:
                  raise SystemExit('import anchor not found')
              s=s.replace(anchor,anchor+'\n'+imp,1)

          init="const handlePre2Interview=createPre2Interview({readJson,send,fail});"
          if init not in s:
              anchor="const handleTalkQuest=createTalkQuest({verifyUser,readJson,send,fail});"
              if anchor not in s:
                  raise SystemExit('handler anchor not found')
              s=s.replace(anchor,anchor+'\n'+init,1)

          route="if(path==='/api/pre2-interview-grade')return handlePre2Interview(req,res);"
          if route not in s:
              anchor="if(path==='/api/talk-quest')return handleTalkQuest(req,res);"
              if anchor not in s:
                  raise SystemExit('route anchor not found')
              s=s.replace(anchor,anchor+'\n  '+route,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Syntax check
        run: |
          node --check pre2-interview.mjs
          node --check server.mjs
      - name: Commit route
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs
          git commit -m "Wire Pre-2 interview grading endpoint"
          git push
