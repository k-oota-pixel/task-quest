name: Add custom magic-link email
on:
  push:
    paths:
      - '.github/workflows/add-custom-magic-mail.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        run: |
          python scripts/patch_custom_magic_mail.py
          node --check server.mjs
      - name: Commit change and clean temporary files
        run: |
          rm .github/workflows/add-custom-magic-mail.yml scripts/patch_custom_magic_mail.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add server.mjs .github/workflows/add-custom-magic-mail.yml scripts/patch_custom_magic_mail.py
          git commit -m 'Add branded magic-link email endpoint'
          git push
