name: Patch pet API retry

on:
  push:
    paths:
      - '.github/workflows/patch-pet-retry.yml'
      - '.github/patch-pet-retry.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pet retry logic
        run: python .github/patch-pet-retry.py
      - name: Validate server syntax
        run: node --check server.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Retry transient Gemini pet chat failures"
          git push
