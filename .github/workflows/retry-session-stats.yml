name: Implement retry session stats

on:
  push:
    paths:
      - '.github/workflows/retry-session-stats.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply retry stats patch
        run: |
          echo '...snip...' | base64 -d > /tmp/retry-stats-patch.py
          python /tmp/retry-stats-patch.py
      - name: Validate backend syntax
        run: |
          node --check retry-question-stats.mjs
          node --check creative-title-events.mjs
          node --check server.mjs
          grep -q "retry-question-first-v1" creative-title-events.mjs
          grep -q "/api/admin/retry-question-stats" server.mjs
      - name: Commit backend changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add retry-question-stats.mjs creative-title-events.mjs server.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Aggregate retry first-attempt stats per completed session'
          git pull --rebase origin main
          git push origin HEAD:main
