name: Title collection and ranking checks
on:
  push:
    branches: [main]
    paths:
      - 'title-model.mjs'
      - 'material-rankings.mjs'
      - 'material-rankings.test.mjs'
      - 'weekly-title-settlement.mjs'
      - 'weekly-title-settlement.test.mjs'
      - 'learning-activity.mjs'
      - 'creative-title-events.mjs'
      - 'daily-coins.mjs'
      - 'daily-coins.test.mjs'
      - 'learning-challenges.mjs'
      - 'learning-titles.mjs'
      - 'title-count-rankings.mjs'
      - 'title-count-rankings.test.mjs'
      - 'learning-titles.test.mjs'
      - 'title-summary.test.mjs'
      - 'title-count-summary.mjs'
      - 'defense-settlement.mjs'
      - 'defense-settlement.test.mjs'
      - '.github/workflows/title-ranking-check.yml'
  pull_request:
    paths:
      - 'title-model.mjs'
      - 'material-rankings.mjs'
      - 'material-rankings.test.mjs'
      - 'weekly-title-settlement.mjs'
      - 'weekly-title-settlement.test.mjs'
      - 'learning-activity.mjs'
      - 'creative-title-events.mjs'
      - 'daily-coins.mjs'
      - 'daily-coins.test.mjs'
      - 'learning-challenges.mjs'
      - 'learning-titles.mjs'
      - 'title-count-rankings.mjs'
      - 'title-count-rankings.test.mjs'
      - 'learning-titles.test.mjs'
      - 'title-summary.test.mjs'
      - 'title-count-summary.mjs'
      - 'defense-settlement.mjs'
      - 'defense-settlement.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test title-summary.test.mjs defense-settlement.test.mjs daily-coins.test.mjs material-rankings.test.mjs weekly-title-settlement.test.mjs
      - run: node --test title-count-rankings.test.mjs learning-titles.test.mjs
