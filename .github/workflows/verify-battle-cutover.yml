name: Verify production title-count update
on:
  pull_request:
    paths:
      - '.github/workflows/verify-battle-cutover.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check the deployed title API version
        shell: bash
        run: |
          url=https://task-quest.onrender.com/api/status
          for attempt in $(seq 1 22); do
            result=$(curl --silent --show-error --fail --max-time 12 "$url" || true)
            printf 'Attempt %s title API version %s\n' "$attempt" "$(jq -r '.titleVersion' <<< "$result" 2>/dev/null || true)"
            if jq -e '.titleVersion == "1.10.20"' <<< "$result" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 12
          done
          exit 1
