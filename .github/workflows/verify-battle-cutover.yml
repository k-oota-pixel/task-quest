name: Verify learner read optimizations in production
on:
  pull_request:
    paths:
      - '.github/workflows/verify-battle-cutover.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify deployed learner API versions
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --fail --max-time 12 https://task-quest.onrender.com/api/status || true)
            if jq -e '.authReadOptimizationVersion == 2 and .challengeReadOptimizationVersion == 1' <<< "$status" >/dev/null 2>&1; then
              printf 'Both read optimizations are live\n'
              exit 0
            fi
            sleep 12
          done
          exit 1
      - name: Probe deployed login without real credentials
        run: |
          for attempt in $(seq 1 3); do
            code=$(curl --silent --show-error --max-time 20 --output /tmp/weekly-check-login.json --write-out '%{http_code}' \
              -H 'Content-Type: application/json' -H 'Origin: https://k-oota-pixel.github.io' \
              --data '{"loginId":"zz_read_rollout_probe_1112","password":"invalid-password-probe"}' \
              https://task-quest.onrender.com/api/account/login)
            printf 'Login probe HTTP %s\n' "$code"
            if [[ "$code" == 401 ]]; then exit 0; fi
            sleep 8
          done
          jq -r '.error // "no API error message"' /tmp/weekly-check-login.json
          exit 1
