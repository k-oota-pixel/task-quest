name: Verify learner read optimizations in production
on:
  pull_request:
    paths:
      - '.github/workflows/verify-battle-cutover.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Verify deployed learner API versions
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl --silent --show-error --fail --max-time 12 https://task-quest.onrender.com/api/status || true)
            if jq -e '.authReadOptimizationVersion == 2 and .challengeReadOptimizationVersion == 1' <<< "$status" >/dev/null 2>&1; then
              printf 'Both read optimizations are live\n'
              exit 0
            fi
            sleep 12
          done
          exit 1
