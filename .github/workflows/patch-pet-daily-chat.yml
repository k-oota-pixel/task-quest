name: Patch pet daily chat

on:
  push:
    paths:
      - '.github/workflows/patch-pet-daily-chat.yml'
      - '.github/patch-pet-daily-chat.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch pet chat API
        run: python .github/patch-pet-daily-chat.py
      - name: Syntax check
        run: node --check server.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add daily pet chat topics and reply suggestions"
          git push
