name: Add pet chat API

on:
  push:
    paths:
      - '.github/workflows/add-pet-chat-api.yml'
      - '.github/add-pet-chat.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch server
        run: python .github/add-pet-chat.py
      - name: Syntax check
        run: node --check server.mjs
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Add pet conversation API"
          git push
