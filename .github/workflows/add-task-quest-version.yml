name: Add Task Quest version label

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-task-quest-version.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add version label
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old_css = '.brand{font-size:21px;font-weight:850;letter-spacing:.06em}.brand small{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);margin-top:5px}'
          new_css = '.brand{font-size:21px;font-weight:850;letter-spacing:.06em}.brand-version{font-size:9px;letter-spacing:.02em;font-weight:700;color:#8a9b94;white-space:nowrap;margin-left:4px;vertical-align:baseline}.brand small{display:block;font-size:11px;letter-spacing:.16em;color:var(--muted);margin-top:5px}'
          old_html = '<div class="brand">TASK QUEST<small>タスククエスト</small></div>'
          new_html = '<div class="brand">TASK QUEST<span class="brand-version">ver1.1.1</span><small>タスククエスト</small></div>'
          if old_css not in s:
              raise SystemExit('brand CSS marker not found')
          if old_html not in s:
              raise SystemExit('brand HTML marker not found')
          s = s.replace(old_css, new_css, 1).replace(old_html, new_html, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Show Task Quest version 1.1.1"
          git push
