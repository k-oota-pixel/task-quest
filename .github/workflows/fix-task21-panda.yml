name: Fix task 21 panda title

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-task21-panda.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Force task 21 to panda and bump page content
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          files = [Path('index.html'), Path('public/index.html')]
          marker = '<meta name="task21-content-version" content="panda-20261026-v2">'

          for path in files:
              text = path.read_text(encoding='utf-8')

              pattern = r'("id"\s*:\s*"quest50-21".*?"title"\s*:\s*")[^"]*(")'
              text, count = re.subn(pattern, r'\1パンダの場所\2', text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f'{path}: quest50-21 title was not found exactly once')

              text = re.sub(r'\s*<meta name="task21-content-version" content="[^"]*">', '', text)
              if '</head>' not in text:
                  raise SystemExit(f'{path}: </head> not found')
              text = text.replace('</head>', marker + '\n</head>', 1)

              path.write_text(text, encoding='utf-8')
              print(f'{path}: quest50-21 title fixed and content version bumped')
          PY
      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html public/index.html
          git commit -m "Publish task 21 panda title"
          git push
