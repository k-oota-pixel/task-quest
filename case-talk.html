<!DOCTYPE html>
<html lang="ja">
<head>
<script src="https://k-oota-pixel.github.io/english-playroom/shell-bridge.js?v=2.1.33"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>サポート付きケーストーク | もんすたでぃ</title>
<style>
:root{--ink:#17342f;--green:#0b6e5b;--green2:#e9f5ef;--muted:#667a72;--bg:#f5f6f1;--line:#dbe6dc;--warm:#fff7df;--warmline:#ead59a;--blue:#edf4ff;--blueink:#315e91}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}button,textarea{font:inherit}button{cursor:pointer}button:focus-visible,textarea:focus-visible{outline:3px solid #d8a63c;outline-offset:2px}.wrap{max-width:1080px;margin:auto;padding:24px 18px 40px}.hero{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:16px}.eyebrow{font-size:10px;letter-spacing:.15em;color:var(--muted);font-weight:850}.hero h1{font-size:clamp(26px,4vw,38px);margin:5px 0 6px;letter-spacing:-.02em}.hero p{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.status{font-size:11px;color:var(--muted);white-space:nowrap;padding-top:8px}.modebar{display:grid;grid-template-columns:1fr 1fr;gap:9px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;margin-bottom:16px}.mode{border:1px solid transparent;border-radius:12px;background:transparent;padding:11px 12px;text-align:left;color:var(--ink)}.mode strong{display:block;font-size:14px}.mode span{display:block;margin-top:3px;font-size:10.5px;color:var(--muted);line-height:1.45}.mode.active{background:var(--green2);border-color:#b8d9ca}.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:16px}.panel{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 7px 24px #17342f0a}.side{padding:15px}.sidehead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.sidehead strong{font-size:13px}.quiet{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 9px;font-size:11px;color:var(--ink)}.tasklist{display:grid;gap:6px;max-height:650px;overflow:auto;padding-right:2px}.taskbtn{display:grid;grid-template-columns:28px minmax(0,1fr);align-items:center;text-align:left;gap:7px;width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 8px;color:var(--ink)}.taskbtn.active{background:var(--green2);border-color:#9cc9b5}.taskbtn span:first-child{font-size:10px;color:var(--muted)}.taskbtn span:last-child{font-size:11.5px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.main{padding:18px}.casehead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.casehead h2{margin:4px 0 0;font-size:22px}.casecount{font-size:11px;color:var(--muted);padding-top:5px}.brief{display:grid;gap:9px;margin-top:14px}.briefbox{border-radius:13px;padding:13px 14px;background:#f7f9f5}.briefbox.task{background:var(--warm);border:1px solid var(--warmline)}.briefbox b{display:block;font-size:9.5px;letter-spacing:.12em;color:var(--muted);margin-bottom:5px}.briefbox p{margin:0;line-height:1.6;font-size:14px}.ja{color:#586b64;font-size:12px!important;margin-top:5px!important}.brief.easy .ja{font-size:16px!important;color:var(--ink);margin-top:0!important;font-weight:650;line-height:1.7}.brief.easy .briefbox{padding:16px 18px}.brief.easy .briefbox b{font-size:10px;letter-spacing:.1em;margin-bottom:6px}.chat{margin-top:14px;background:#f6f8f4;border:1px solid #e3ebe4;border-radius:15px;padding:13px;min-height:260px;max-height:440px;overflow:auto;display:flex;flex-direction:column;gap:9px}.row{display:flex;gap:8px;align-items:flex-end}.row.you{justify-content:flex-end}.who{font-size:9px;color:var(--muted);width:48px;flex:0 0 48px;text-align:center}.bubble{max-width:78%;border:1px solid var(--line);background:#fff;border-radius:14px 14px 14px 5px;padding:10px 12px;font-size:14px;line-height:1.55;white-space:pre-wrap;word-break:break-word}.row.you .bubble{background:#175f51;color:#fff;border-color:#175f51;border-radius:14px 14px 5px 14px}.system{background:var(--blue);border:1px solid #cfe0f4;border-radius:12px;padding:10px 12px;color:#274f78;font-size:12px;line-height:1.6}.system.success{background:#e8f6ed;border-color:#b6ddc4;color:#246141}.system.warn{background:#fff5df;border-color:#ead6a5;color:#735a23}.support{margin-top:10px;border:1px solid var(--line);border-radius:13px;padding:12px;background:#fff}.support[hidden]{display:none}.support-title{display:flex;align-items:center;justify-content:space-between;gap:8px}.support-title strong{font-size:13px}.support-grid{display:grid;gap:8px;margin-top:9px}.tip{background:#f7f8f4;border-radius:10px;padding:9px 10px;font-size:12px;line-height:1.6}.tip b{display:block;font-size:10px;color:var(--muted);margin-bottom:2px}.sample{font-size:15px;font-weight:700;color:#245a4d}.composer{margin-top:12px}.composer label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.composer textarea{display:block;width:100%;min-height:82px;resize:vertical;border:1px solid #bfcfc5;border-radius:12px;padding:12px 13px;font-size:16px;line-height:1.55;color:var(--ink)}.sendrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:9px}.sendactions{display:flex;gap:7px;align-items:center}.primary,.backup{border:0;border-radius:11px;padding:11px 16px;font-weight:850}.primary{background:var(--green);color:#fff}.backup{background:#fff;border:1px solid #9fbcb1;color:#355e52}.backup[hidden]{display:none}.primary:disabled,.backup:disabled{opacity:.55;cursor:wait}.helpbtn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;font-size:11px;color:var(--ink)}.meta{font-size:10px;color:var(--muted)}.details{margin-top:10px;font-size:11px;color:var(--muted)}.details summary{cursor:pointer}.details p{line-height:1.65}.next{margin-top:12px;border:1px solid #b8d9ca;background:var(--green2);color:#245a4d;border-radius:11px;padding:10px 14px;font-weight:800}.loading{opacity:.7}.notice{font-size:10px;color:var(--muted);line-height:1.6;margin-top:12px}@media(max-width:760px){.wrap{padding:14px 12px 28px}.hero{display:block}.status{white-space:normal}.layout{grid-template-columns:1fr}.side{padding:11px}.tasklist{display:flex;overflow:auto;max-height:none;gap:6px;padding-bottom:4px}.taskbtn{min-width:138px}.main{padding:14px}.bubble{max-width:88%}.who{display:none}.sendrow{align-items:flex-start;flex-direction:column}.sendactions{width:100%}.primary{flex:1}.modebar{gap:6px}.mode{padding:9px}.mode span{font-size:10px}}
</style>
</head>
<body>
<main class="wrap">
  <section class="hero">
    <div><div class="eyebrow">COMMUNICATION REPAIR</div><h1>サポート付きケーストーク</h1><p>正解を当てるのではなく、相手に伝わるまで言い直してみよう。会話は英語、学習サポートは日本語で表示します。</p></div>
    <div id="connection" class="status" role="status">AI接続を確認しています…</div>
  </section>
  <section class="modebar" aria-label="サポートモード">
    <button class="mode active" type="button" data-mode="easy"><strong>EASY</strong><span>語句ヒント・選択肢・お手本を多めに表示</span></button>
    <button class="mode" type="button" data-mode="normal"><strong>NORMAL</strong><span>相手の聞き返し中心。必要なときだけヒント</span></button>
  </section>
  <div class="layout">
    <aside class="panel side">
      <div class="sidehead"><strong>ケースを選ぶ</strong><button id="random" class="quiet" type="button">🎲 ランダム</button></div>
      <nav id="tasklist" class="tasklist" aria-label="ケース一覧"></nav>
    </aside>
    <section class="panel main">
      <div class="casehead"><div><div id="questnum" class="eyebrow"></div><h2 id="title">読み込み中…</h2></div><div id="casecount" class="casecount"></div></div>
      <div class="brief">
        <div class="briefbox"><b>SITUATION / 場面</b><p id="situation"></p><p id="jaSituation" class="ja"></p></div>
        <div class="briefbox task"><b>YOUR MISSION / ミッション</b><p id="task"></p><p id="jaTask" class="ja"></p></div>
      </div>
      <div id="chat" class="chat" aria-live="polite"></div>
      <section id="support" class="support" hidden>
        <div class="support-title"><strong>🧩 日本語サポート</strong><span id="supportLevel" class="meta"></span></div>
        <div id="supportGrid" class="support-grid"></div>
      </section>
      <form id="form" class="composer">
        <label for="answer">英語で相手に伝えてみよう</label>
        <textarea id="answer" lang="en" maxlength="400" spellcheck="false" autocapitalize="sentences" placeholder="Type your English here…" required></textarea>
        <div class="sendrow">
          <div><button id="help" type="button" class="helpbtn">💡 ヒントを見る</button> <span id="repairs" class="meta"></span></div>
          <div class="sendactions"><button id="send" class="primary" type="submit">送る →</button><button id="backup" class="backup" type="button" hidden title="通常AIが混雑・利用できないときに使います">予備</button></div>
        </div>
      </form>
      <details id="details" class="details" hidden><summary>今回の学習ポイントを見る</summary><p id="feedback"></p></details>
      <button id="next" class="next" type="button" hidden>次のケースへ →</button>
      <p class="notice">AIは「目的が相手に伝わったか」を判定します。多少の文法ミスだけでは失敗にしません。回答は判定のためGoogleへ送信されます。個人情報は入力しないでください。</p>
    </section>
  </div>
</main>
<script type="module">
const API='https://task-quest.onrender.com';
const $=id=>document.getElementById(id);
let tasks=[],current=0,mode='easy',repairCount=0,hintLevel=0,busy=false,queuedBackup=false,activeBackup=false,lastResult=null;
try{mode=localStorage.getItem('case-talk-mode')||'easy';}catch{}
if(!['easy','normal'].includes(mode))mode='easy';

function extractTaskArray(source){
  const marker='const TASKS=';let start=source.indexOf(marker);if(start<0)throw Error('task data not found');start+=marker.length;
  while(/\s/.test(source[start]))start++;
  if(source[start]!=='[')throw Error('task data invalid');
  let depth=0,quote='',escaped=false;
  for(let i=start;i<source.length;i++){
    const ch=source[i];
    if(quote){if(escaped)escaped=false;else if(ch==='\\')escaped=true;else if(ch===quote)quote='';continue;}
    if(ch==='"'||ch==="'"||ch==='`'){quote=ch;continue;}
    if(ch==='[')depth++;else if(ch===']'){depth--;if(depth===0)return source.slice(start,i+1);}
  }
  throw Error('task data incomplete');
}
async function loadTasks(){
  try{
    const html=await fetch('./index.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error();return r.text();});
    const parsed=JSON.parse(extractTaskArray(html));
    if(Array.isArray(parsed)&&parsed.length)return parsed;
  }catch(error){console.warn('Detailed task data unavailable',error);}
  const basic=await fetch('./tasks.json',{cache:'no-store'}).then(r=>r.json());
  return basic.map((t,i)=>({...t,title:`ケース ${String(i+1).padStart(2,'0')}`,icon:'💬',jaS:'',jaT:'',hints:[],sample:''}));
}
function taskLabel(t,i){return t.title||`ケース ${String(i+1).padStart(2,'0')}`;}
function setMode(next){mode=next;try{localStorage.setItem('case-talk-mode',mode);}catch{}document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));renderSupport();}
function npcOpening(t){const s=(t.situation||'').toLowerCase();if(/taxi/.test(s))return 'Hello. Where would you like to go?';if(/meet someone|friend/.test(s))return 'Hi!';if(/restaurant|café|cafe|store|shop|pharmacy|post office|library|hotel|airport|station|gym|supermarket/.test(s))return 'Hello. How can I help you?';return 'Hello. How can I help you?';}
function npcRepair(t,count){const q=(t.task||'').toLowerCase();if(count===1)return 'Sorry, could you say that again?';if(/where/.test(q))return 'Sorry, what place are you looking for?';if(/what time|when/.test(q))return 'Sorry, what time would you like to know about?';if(/how much|cost/.test(q))return 'Sorry, what would you like to know the price of?';if(/ask if|can i|can you|could/.test(q))return 'Sorry, could you tell me a little more?';return count===2?'Sorry, what would you like me to do?':'Sorry, could you say it another way?';}
function npcSuccess(t){const q=(t.task||'').toLowerCase();if(/ask where/.test(q))return 'Sure. Let me show you.';if(/ask what time|when/.test(q))return 'Of course. Let me check that for you.';if(/how much|cost/.test(q))return 'Sure. Let me check the price.';if(/ask if/.test(q))return 'Yes, let me check for you.';if(/tell|ask.*take you/.test(q))return 'Of course.';return 'Sure. I understand.';}
function addRow(kind,text){const row=document.createElement('div');row.className='row '+kind;const who=document.createElement('span');who.className='who';who.textContent=kind==='you'?'YOU':'PARTNER';const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;if(kind==='you')row.append(bubble,who);else row.append(who,bubble);$('chat').append(row);$('chat').scrollTop=$('chat').scrollHeight;}
function addSystem(text,type=''){const div=document.createElement('div');div.className='system '+type;div.textContent=text;$('chat').append(div);$('chat').scrollTop=$('chat').scrollHeight;}
function renderTaskList(){const nav=$('tasklist');nav.replaceChildren();tasks.forEach((t,i)=>{const b=document.createElement('button');b.type='button';b.className='taskbtn'+(i===current?' active':'');b.innerHTML=`<span>${String(i+1).padStart(2,'0')}</span><span></span>`;b.lastElementChild.textContent=taskLabel(t,i);b.onclick=()=>openCase(i);nav.append(b);});}
function openCase(i){current=i;repairCount=0;hintLevel=0;lastResult=null;const t=tasks[i],easy=mode==='easy',brief=document.querySelector('.brief'),labels=brief.querySelectorAll('.briefbox>b');$('questnum').textContent=`CASE ${String(i+1).padStart(2,'0')} / ${tasks.length}`;$('title').textContent=taskLabel(t,i);$('situation').textContent=t.situation||'';$('task').textContent=t.task||'';$('jaSituation').textContent=t.jaS||t.situation||'';$('jaTask').textContent=t.jaT||t.task||'';$('situation').hidden=easy;$('task').hidden=easy;$('jaSituation').hidden=false;$('jaTask').hidden=false;brief.classList.toggle('easy',easy);if(labels[0])labels[0].textContent=easy?'状況':'SITUATION / 場面';if(labels[1])labels[1].textContent=easy?'ミッション':'YOUR MISSION / ミッション';$('casecount').textContent='伝え直し 0回';$('answer').value='';$('chat').replaceChildren();addRow('partner',npcOpening(t));addSystem(easy?'EASYモードです。困ったら下のサポートを使いながら、相手に伝えてみよう。':'NORMALモードです。まずは自分の英語で伝えてみよう。必要ならヒントを使えます。');$('details').hidden=true;$('next').hidden=true;$('support').hidden=!easy;renderSupport();renderTaskList();$('answer').focus();}
function cleanHint(value){return String(value||'').replace(/^例[:：]\s*/,'').trim();}
function renderSupport(){if(!tasks.length)return;const t=tasks[current],grid=$('supportGrid');grid.replaceChildren();$('supportLevel').textContent=mode==='easy'?'サポート多め':'必要なときだけ';if(mode==='normal'&&hintLevel===0){$('support').hidden=true;return;}$('support').hidden=false;const hints=Array.isArray(t.hints)?t.hints:[];const add=(label,text,cls='')=>{if(!text)return;const box=document.createElement('div');box.className='tip';const b=document.createElement('b');b.textContent=label;const p=document.createElement('div');p.className=cls;p.textContent=text;box.append(b,p);grid.append(box);};if(mode==='easy'){add('考え方',hints[0]||t.jaT||'ミッションの内容を、相手に分かる形でもう少しくわしく言ってみよう。');add('使える語句・表現',hints[1]||'だれに・何を・どうしてほしいかを入れると伝わりやすくなります。');if(repairCount>0||hintLevel>0)add('お手本',t.sample||cleanHint(hints[2])||lastResult?.example||'', 'sample');}else{const idx=Math.min(Math.max(hintLevel-1,0),2);add(`ヒント ${hintLevel}`,hints[idx]||t.jaT||lastResult?.message||'相手に伝えたい内容を、もう少しくわしくしてみよう。');if(hintLevel>=3)add('お手本',t.sample||lastResult?.example||cleanHint(hints[2])||'', 'sample');}}
function setBusy(value){busy=value;$('send').disabled=value;$('backup').disabled=value;$('answer').disabled=value;$('help').disabled=value;$('send').textContent=value&&!activeBackup?'AIが確認中…':'送る →';$('backup').textContent=value&&activeBackup?'予備AI確認中…':'予備';document.body.classList.toggle('loading',value);}
async function evaluate(answer,useBackup){const headers=await (await import('./firebase-security.js?v=2.1.2')).apiHeaders();const response=await fetch(API+'/api/evaluate',{method:'POST',headers,body:JSON.stringify({taskId:tasks[current].id,answer,useBackup}),signal:AbortSignal.timeout(45000)});let result={};try{result=await response.json();}catch{}if(!response.ok)throw new Error(result.error||'AIに接続できませんでした。');return result;}
async function submitAnswer(){if(busy)return;const answer=$('answer').value.trim();if(!answer)return;activeBackup=queuedBackup;queuedBackup=false;addRow('you',answer);$('answer').value='';setBusy(true);try{const result=await evaluate(answer,activeBackup);lastResult=result;if(result.clear){addRow('partner',npcSuccess(tasks[current]));addSystem(repairCount>0?'伝わりました！ 相手の反応を見ながら言い直して、最後まで目的を達成できました。':'伝わりました！ 一度で相手に目的を伝えることができました。','success');$('feedback').textContent=result.message+(result.example?'\n表現例：'+result.example:'');$('details').hidden=false;$('next').hidden=false;$('support').hidden=true;}else{repairCount++;$('casecount').textContent=`伝え直し ${repairCount}回`;addRow('partner',npcRepair(tasks[current],repairCount));addSystem(mode==='easy'?'まだ十分には伝わっていません。日本語サポートを使って、もう一度言い直してみよう。':'相手が聞き返しています。まずは自分の言葉で、もう一度伝えてみよう。','warn');$('feedback').textContent=result.message+(result.example?'\n表現例：'+result.example:'');$('details').hidden=false;if(mode==='easy')$('support').hidden=false;renderSupport();}}catch(error){addSystem((error.name==='TimeoutError'?'時間がかかっています。もう一度試してください。':error.message)+(activeBackup?'':' 通常AIが使えない場合は、隣の「予備」を使えます。'),'warn');$('answer').value=answer;}finally{activeBackup=false;setBusy(false);$('answer').focus();}}
$('form').onsubmit=e=>{e.preventDefault();submitAnswer();};
$('backup').onclick=()=>{if(!$('form').reportValidity())return;queuedBackup=true;submitAnswer();};
$('help').onclick=()=>{hintLevel=Math.min(3,hintLevel+1);$('support').hidden=false;renderSupport();};
$('next').onclick=()=>openCase((current+1)%tasks.length);
$('random').onclick=()=>{if(tasks.length<2)return;let i=current;while(i===current)i=Math.floor(Math.random()*tasks.length);openCase(i);};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{setMode(b.dataset.mode);openCase(current);});

async function init(){
  document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));
  try{tasks=await loadTasks();renderTaskList();openCase(0);}catch(error){$('title').textContent='ケースを読み込めませんでした';addSystem('ページを再読み込みしてください。','warn');console.error(error);}
  fetch(API+'/api/status').then(r=>r.json()).then(s=>{$('backup').hidden=s.backupReady!==true;$('connection').textContent=s.ready?'AI接続：準備OK'+(s.backupReady?' / 予備あり':''):'AI接続を確認してください。';}).catch(()=>{$('connection').textContent='AIサーバーに接続できません。';});
}
init();
</script>
</body>
</html>
